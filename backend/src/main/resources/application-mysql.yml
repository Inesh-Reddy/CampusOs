# MySQL profile: activate with --spring.profiles.active=local,mysql
# Credentials come from the environment (see .env.example / local .env, never commit secrets).
spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/campusos?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:campusos}
    password: ${DB_PASSWORD:}
    driver-class-name: ${DB_DRIVER:com.mysql.cj.jdbc.Driver}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
